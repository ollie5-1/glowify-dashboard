# Glowify dashboard config THUIS
# Volledige strategie-config voor het Glowify-dashboard op de thuisinstallatie van Olivier.
# Gebruik: alles selecteren (Ctrl+A), kopieren, en plakken in:
# Glowify-dashboard > potlood > drie puntjes > Ruwe configuratie-editor (alles wissen, dit plakken)
# Vereist: de Glowify-blokken in configuration.yaml (lichtgroepen, scripts, schuifjes), browser_mod en auto-entities
# Opruimen: geef een entiteit het label 'verberg' om ze uit de pop-ups te houden; zet ze op Verborgen voor de automatische views
# Versie: 2026-07-03c (Berging zonder lichtgroep, ledbox is geen lamp)

strategy:
  type: custom:mushroom-strategy
  options:
    views:
      home:
        hidden: true
    extra_views:
      - title: Thuis
        path: glowify-thuis
        icon: mdi:home-heart
        order: 0
        badges: []
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:lightbulb-group
                icon_color: >-
                  {{ 'orange' if states.light | selectattr('entity_id', 'search', 'verlichting_') | selectattr('state', 'eq', 'on') | list | count > 0 else 'grey' }}
                content: >-
                  {{ states.light | selectattr('entity_id', 'search', 'verlichting_') | selectattr('state', 'eq', 'on') | list | count }} kamers verlicht
                tap_action:
                  action: call-service
                  service: light.turn_off
                  target:
                    entity_id:
                      - light.verlichting_inkomhal
                      - light.verlichting_woonkamer
                      - light.verlichting_office_sumato
                      - light.verlichting_tuin
                      - light.verlichting_hal_1e_verdiep
                      - light.verlichting_bureau_ruimte
                      - light.verlichting_master_bedroom
                      - light.verlichting_badkamer
                      - light.verlichting_keuken
                      - light.verlichting_zolder_hal
                      - light.verlichting_zolder
              - type: template
                icon: mdi:tune
                icon_color: purple
                content: Scenes
                tap_action:
                  action: navigate
                  navigation_path: '#instellingen'
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Gelijkvloers
                icon: mdi:home-floor-0
              - type: custom:bubble-card
                card_type: button
                button_type: state
                entity: sensor.bewegingssensor_inkomhal_temperature
                name: Inkomhal
                icon: mdi:door
                show_state: true
                tap_action:
                  action: navigate
                  navigation_path: '#inkomhal'
                hold_action:
                  action: navigate
                  navigation_path: /dashboard-glowify/inkomhal
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: '#inkomhal'
                  hold_action:
                    action: navigate
                    navigation_path: /dashboard-glowify/inkomhal
                styles: |
                  .bubble-sub-button-1 { display: ${hass.states['binary_sensor.bewegingssensor_inkomhal_occupancy'].state === 'on' ? 'inline-flex' : 'none'} !important; color: red !important; }
                  ${hass.states['lock.voordeur_slot'].state === 'locked' ? '.bubble-sub-button-2 { background-color: rgba(76, 175, 80, 0.25) !important; color: rgb(46, 125, 50) !important; }' : '.bubble-sub-button-2 { background-color: rgb(229, 57, 53) !important; color: white !important; }'}
                  ${subButtonIcon[1]?.setAttribute("icon", hass.states['lock.voordeur_slot'].state === 'locked' ? 'mdi:lock' : 'mdi:lock-open-variant')}
                  ${hass.states['light.verlichting_inkomhal'].state === 'on' ? '.bubble-sub-button-3 { display: none !important; }' : '.bubble-sub-button-4 { display: none !important; }'}
                  ${hass.states['light.verlichting_inkomhal'].state === 'on' ? '.bubble-sub-button-4 { background-color: ' + (hass.states['light.verlichting_inkomhal'].attributes.rgb_color ? 'rgb(' + hass.states['light.verlichting_inkomhal'].attributes.rgb_color.join(',') + ')' : 'var(--primary-color)') + ' !important; color: white !important; }' : ''}
                sub_button:
                  - entity: binary_sensor.bewegingssensor_inkomhal_occupancy
                    icon: mdi:motion-sensor
                    show_background: false
                    tap_action:
                      action: none
                  - entity: lock.voordeur_slot
                    icon: mdi:lock
                    tap_action:
                      action: toggle
                  - entity: light.verlichting_inkomhal
                    icon: mdi:lightbulb
                    tap_action:
                      action: fire-dom-event
                      browser_mod:
                        service: browser_mod.sequence
                        data:
                          sequence:
                            - service: light.turn_on
                              data:
                                entity_id: light.verlichting_inkomhal
                            - service: browser_mod.popup
                              data:
                                title: Verlichting Inkomhal
                                timeout: 13000
                                content:
                                  type: vertical-stack
                                  cards:
                                    - type: tile
                                      entity: light.verlichting_inkomhal
