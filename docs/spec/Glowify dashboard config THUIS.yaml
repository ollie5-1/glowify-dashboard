                                        - type: template
                                          icon: mdi:candle
                                          icon_color: purple
                                          content: Gezellig
                                          tap_action:
                                            action: call-service
                                            service: script.glowify_scene_gezellig
                                            data:
                                              doelgroep: light.verlichting_inkomhal
                                        - type: template
