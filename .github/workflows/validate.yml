name: Validate

# Bouwt en test bij elke push/PR. De HACS-verpakking wordt enkel gevalideerd
# op gepubliceerde releases en wekelijks, zodat elke gewone main-push groen is.
on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  hacs:
    # Draait enkel op gepubliceerde releases en het wekelijkse schema, niet op
    # gewone pushes/PR's (waar er nog geen release-asset bestaat om te checken).
    if: github.event_name == 'release' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS-validatie (Dashboard/plugin)
        uses: hacs/action@main
        with:
          category: plugin
