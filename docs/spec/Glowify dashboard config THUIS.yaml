                                          content: Fel
                                          tap_action:
                                            action: call-service
                                            service: script.glowify_scene_fel
                                            data:
                                              doelgroep: light.verlichting_inkomhal
                    hold_action:
                      action: more-info
                  - entity: light.verlichting_inkomhal
                    icon: mdi:lightbulb-on
                    tap_action:
                      action: call-service
                      service: light.turn_off
                      target:
                        entity_id: light.verlichting_inkomhal
                    hold_action:
